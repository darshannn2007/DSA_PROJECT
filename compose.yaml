services:
  campusconnect:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: sqlite:////app/data/campusconnect.db
    volumes:
      - campusconnect_data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - campusconnect

volumes:
  campusconnect_data:
  caddy_data:
  caddy_config:
