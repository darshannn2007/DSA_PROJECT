<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CampusHive</title>
  <link rel="icon" type="image/jpeg" href="/static/images/campushive-logo.jpg">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body data-page="login">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="auth-page">
    <section class="auth-card" aria-labelledby="login-heading">
      <header class="auth-header">
        <a href="/" class="auth-brand">
          <img src="/static/images/campushive-logo.jpg" alt="" class="nav-logo-img">
          <span>CampusHive</span>
        </a>
        <h1 id="login-heading" class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to connect with your campus community</p>
      </header>

      <div id="login-error" class="alert-error" role="alert" aria-live="assertive"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username" class="form-label">Username</label>
          <input
            type="text"
            id="login-username"
            name="username"
            class="form-input"
            placeholder="e.g. alex_chen"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="password-field-wrap">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="btn btn-outline btn-sm password-toggle" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>
      </form>

      <footer class="auth-footer">
        <p>Don't have an account? <a href="/register">Create one</a></p>
      </footer>
    </section>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
